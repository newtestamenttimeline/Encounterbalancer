<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encounter Balancer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-mono,monospace);font-size:13px;color:var(--color-text-primary);padding:20px;}
h2{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 8px;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary);}
h2:first-child{margin-top:0;}
label{font-size:11px;color:var(--color-text-secondary);display:block;margin-bottom:3px;}
input,select{background:var(--color-background-secondary);border:0.5px solid var(--color-border-primary);color:var(--color-text-primary);padding:5px 8px;width:100%;font-family:var(--font-mono,monospace);font-size:12px;border-radius:var(--border-radius-md);}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:8px;}
.row3{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:8px;}
.field{display:flex;flex-direction:column;}
button{background:var(--color-background-secondary);border:0.5px solid var(--color-border-primary);color:var(--color-text-primary);padding:7px 16px;font-family:var(--font-mono,monospace);font-size:12px;cursor:pointer;border-radius:var(--border-radius-md);margin-right:6px;margin-top:4px;}
button:hover{background:var(--color-background-tertiary);}
button.primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
button.primary:hover{opacity:0.85;}
button:disabled{opacity:0.35;cursor:default;}
.monster-card{padding:10px 12px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:8px;}
.monster-card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11px;color:var(--color-text-secondary);}
.pc-row{display:grid;grid-template-columns:140px 80px 80px 80px 28px;gap:6px;align-items:end;margin-bottom:6px;padding:8px 10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);}
.remove-btn{background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:16px;padding:0;line-height:1;margin-bottom:2px;}
.remove-btn:hover{color:var(--color-text-primary);}
#output{margin-top:20px;border-top:0.5px solid var(--color-border-tertiary);padding-top:16px;}
.result-card{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:10px;font-size:12px;line-height:1.9;}
.win{color:#3B6D11;font-weight:500;}.lose{color:#A32D2D;font-weight:500;}
@media(prefers-color-scheme:dark){.win{color:#C0DD97;}.lose{color:#F09595;}}
.stat-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:6px;}
.stat{display:flex;flex-direction:column;}
.stat-val{font-size:18px;font-weight:500;}
.stat-lbl{font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.8px;}
.battlefield{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-bottom:8px;min-height:80px;}
.bf-inner{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.bf-section{display:flex;flex-direction:column;gap:4px;}
.bf-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--color-text-secondary);margin-bottom:2px;}
.bf-clusters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
.bf-cluster{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-width:44px;align-items:center;}
.bf-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;justify-content:center;min-height:24px;}
.bf-action-row{min-height:20px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.bf-divider{width:1px;background:var(--color-border-tertiary);margin:0 4px;align-self:stretch;}
.combatant{display:flex;flex-direction:column;align-items:center;gap:2px;}
.combatant-em{font-size:20px;line-height:1;}
.hp-bar-wrap{width:32px;height:4px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden;}
.hp-bar{height:4px;border-radius:2px;transition:width 0.2s;}
.ticker-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:16px;margin-bottom:8px;min-height:56px;display:flex;align-items:center;justify-content:center;}
.ticker-line{font-size:14px;font-weight:500;text-align:center;transition:opacity 0.2s;opacity:1;}
.ticker-line.fade{opacity:0;}
.ticker-controls{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.speed-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-secondary);}
.transcript-box{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;margin-top:8px;}
.transcript-box pre{font-size:11px;color:var(--color-text-secondary);white-space:pre-wrap;line-height:1.7;user-select:all;}
.zone-tag{font-size:10px;padding:1px 6px;border-radius:100px;background:var(--color-background-tertiary);border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);margin-left:4px;vertical-align:middle;}
.party-tags{margin-bottom:6px;font-size:11px;color:var(--color-text-secondary);}
.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:16px 0;}
.btn-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.header-meta{font-size:11px;color:var(--color-text-secondary);margin-bottom:12px;line-height:1.8;}
.boss-label{font-size:10px;padding:1px 6px;border-radius:100px;background:var(--color-background-tertiary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);margin-left:6px;}
.progress{font-size:11px;color:var(--color-text-secondary);}
.round-label{font-size:10px;color:var(--color-text-secondary);margin-bottom:6px;}
</style>
</head>
<body>

<h2>Encounter</h2>
<div id="monster-builder"></div>
<button onclick="UI.addMonster(false)" style="margin-bottom:4px;">+ Add minion</button>
<hr class="divider">
<h2>Party</h2>
<div class="row" style="margin-bottom:12px;">
  <div class="field"><label>Level</label>
    <select id="plevel">
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
    </select>
  </div>
  <div class="field"><label>Simulations</label><input id="nsims" type="number" value="100"/></div>
</div>
<div id="party-builder"></div>
<button onclick="UI.addPC()">+ Add PC</button>
<hr class="divider">
<div class="btn-row">
  <button class="primary" onclick="UI.runSims()">Run simulations</button>
  <button onclick="UI.watchFight()">Watch one fight</button>
  <button onclick="UI.saveEncounter()">Save encounter</button>
  <button onclick="UI.loadEncounter()">Load encounter</button>
</div>
<div id="output"></div>

<script>
// ============================================================
// DATA
// ============================================================
const DATA = (() => {
  const CLASS_EMOJI = {fighter:'⚔️',barbarian:'🪓',paladin:'🛡️',rogue:'🗡️',ranger:'🏹',cleric:'✨',druid:'🌿',wizard:'🔮',sorcerer:'💫',bard:'🎵',warlock:'👁️'};
  const MONSTER_EMOJI = {boss:'💀',minion:'👺'};
  const ATTACK_EMOJI  = {melee:'⚔️',ranged:'🏹',magic:'✨'};
  const CLASS_ATTACK_TYPE = {fighter:'melee',barbarian:'melee',paladin:'melee',rogue:'melee',ranger:'ranged',cleric:'magic',druid:'magic',wizard:'magic',sorcerer:'magic',bard:'magic',warlock:'magic'};

  const CLASSES = [
    {name:'Fighter',  zone:'melee',hpDie:10,ac:16,atkMod:3,dmgDie:8, dmgBonus:3, cls:'fighter'},
    {name:'Barbarian',zone:'melee',hpDie:12,ac:15,atkMod:4,dmgDie:12,dmgBonus:4, cls:'barbarian'},
    {name:'Paladin',  zone:'melee',hpDie:10,ac:17,atkMod:3,dmgDie:8, dmgBonus:3, cls:'paladin'},
    {name:'Rogue',    zone:'melee',hpDie:8, ac:14,atkMod:4,dmgDie:6, dmgBonus:3, cls:'rogue'},
    {name:'Ranger',   zone:'back', hpDie:10,ac:15,atkMod:3,dmgDie:8, dmgBonus:3, cls:'ranger'},
    {name:'Cleric',   zone:'back', hpDie:8, ac:16,atkMod:3,dmgDie:8, dmgBonus:2, cls:'cleric'},
    {name:'Druid',    zone:'back', hpDie:8, ac:13,atkMod:3,dmgDie:8, dmgBonus:2, cls:'druid'},
    {name:'Wizard',   zone:'back', hpDie:6, ac:12,atkMod:4,dmgDie:10,dmgBonus:3, cls:'wizard'},
    {name:'Sorcerer', zone:'back', hpDie:6, ac:12,atkMod:4,dmgDie:10,dmgBonus:3, cls:'sorcerer'},
    {name:'Bard',     zone:'back', hpDie:8, ac:13,atkMod:3,dmgDie:8, dmgBonus:2, cls:'bard'},
    {name:'Warlock',  zone:'back', hpDie:8, ac:13,atkMod:4,dmgDie:10,dmgBonus:4, cls:'warlock'},
  ];

  const FULL_SLOT = [0,2,3,4,4,5,5,6,6,7,7];
  const HALF_SLOT = [0,1,1,1,1,2,2,3,3,4,4];

  function slotLvl(cls,lvl){ return ['paladin','ranger'].includes(cls)?HALF_SLOT[lvl]:FULL_SLOT[lvl]; }
  function spellSlots(cls,lvl){ if(cls==='warlock')return Math.min(4,Math.ceil(lvl/2)); return [0,2,3,4,4,5,5,6,6,7,7][lvl]||2; }

  const CANTRIPS = {
    wizard:  {name:'Fire Bolt',       type:'attack',dc:0,  dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,10)},
    sorcerer:{name:'Fire Bolt',       type:'attack',dc:0,  dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,10)},
    warlock: {name:'Eldritch Blast',  type:'attack',dc:0,  dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,10)+3},
    cleric:  {name:'Sacred Flame',    type:'save',  dc:13, dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,8)},
    druid:   {name:'Produce Flame',   type:'attack',dc:0,  dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,8)},
    bard:    {name:'Vicious Mockery', type:'save',  dc:13, dmg:(lvl)=>ENGINE.rollN(lvl>=5?2:1,4)},
  };

  const SPELLS = {
    wizard:[
      {name:'Magic Missile',   minLvl:1,aoe:false,zone:null,   save:0,  dmg:(sl)=>{let t=0;for(let i=0;i<2+sl;i++)t+=ENGINE.roll(4)+1;return t;}},
      {name:'Scorching Ray',   minLvl:3,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN((sl+1)*2,6)},
      {name:'Fireball',        minLvl:5,aoe:true, zone:'melee',save:13, dmg:(sl)=>ENGINE.rollN(5+sl,6)},
    ],
    sorcerer:[
      {name:'Chromatic Orb',   minLvl:1,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN(2+sl,8)},
      {name:'Scorching Ray',   minLvl:3,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN((sl+1)*2,6)},
      {name:'Fireball',        minLvl:5,aoe:true, zone:'melee',save:13, dmg:(sl)=>ENGINE.rollN(5+sl,6)},
    ],
    druid:[
      {name:'Thunderwave',     minLvl:1,aoe:true, zone:'melee',save:13, dmg:(sl)=>ENGINE.rollN(sl*2,8)},
      {name:'Moonbeam',        minLvl:3,aoe:false,zone:null,   save:13, dmg:(sl)=>ENGINE.rollN(sl,10)},
      {name:'Call Lightning',  minLvl:5,aoe:false,zone:null,   save:13, dmg:(sl)=>ENGINE.rollN(sl,10)},
    ],
    cleric:[
      {name:'Guiding Bolt',    minLvl:1,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN(3+sl,6)},
      {name:'Spiritual Weapon',minLvl:3,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN(Math.floor(sl/2)+1,8)+3},
      {name:'Spirit Guardians',minLvl:5,aoe:true, zone:'melee',save:13, dmg:(sl)=>ENGINE.rollN(sl,8)},
    ],
    bard:[
      {name:'Dissonant Whispers',minLvl:1,aoe:false,zone:null,   save:13,dmg:(sl)=>ENGINE.rollN(2+sl,6)},
      {name:'Shatter',           minLvl:3,aoe:true, zone:'melee',save:13,dmg:(sl)=>ENGINE.rollN(1+sl,8)},
      {name:'Hypnotic Pattern',  minLvl:5,aoe:false,zone:null,   save:14,dmg:()=>0},
    ],
    warlock:[
      {name:'Eldritch Blast',  minLvl:1,aoe:false,zone:null,   save:0,  dmg:(sl,cl)=>ENGINE.rollN(cl>=5?2:1,10)+(cl>=5?6:3)},
      {name:'Hunger of Hadar', minLvl:5,aoe:true, zone:'melee',save:13, dmg:(sl)=>ENGINE.rollN(sl,6)+ENGINE.rollN(sl,6)},
    ],
    paladin:[
      {name:'Divine Smite',    minLvl:1,aoe:false,zone:null,   save:0,  dmg:(sl)=>ENGINE.rollN(sl+1,8)},
      {name:'Thunderous Smite',minLvl:3,aoe:false,zone:null,   save:13, dmg:(sl)=>ENGINE.rollN(sl,6)},
    ],
    ranger:[
      {name:"Hunter's Mark",   minLvl:1,aoe:false,zone:null,   save:0,  dmg:()=>ENGINE.roll(6)},
      {name:'Hail of Thorns',  minLvl:3,aoe:false,zone:null,   save:13, dmg:(sl)=>ENGINE.rollN(sl,10)},
    ],
  };

  return {CLASS_EMOJI,MONSTER_EMOJI,ATTACK_EMOJI,CLASS_ATTACK_TYPE,CLASSES,CANTRIPS,SPELLS,slotLvl,spellSlots};
})();

// ============================================================
// ENGINE
// ============================================================
const ENGINE = (() => {
  function roll(n){return Math.floor(Math.random()*n)+1;}
  function rollN(n,d){let t=0;for(let i=0;i<n;i++)t+=roll(d);return t;}

  function parseDmg(s){
    const m=s.trim().match(/^(\d+)d(\d+)([+-]\d+)?$/i);
    if(!m)return()=>4;
    const[,n,d,mod]=m,b=mod?parseInt(mod):0;
    return()=>{let t=0;for(let i=0;i<+n;i++)t+=roll(+d);return Math.max(1,t+b);};
  }

  function hpForClass(cls,lvl){const die=DATA.CLASSES.find(c=>c.cls===cls)?.hpDie||8,con=2;return die+con+(lvl-1)*Math.floor(die/2+1+con);}
  function acForLevel(base,lvl){return base+Math.floor(lvl/4);}
  function atkForLevel(base,lvl){return base+Math.floor(lvl/3);}
  function extraAtks(cls,lvl){if(cls==='fighter')return lvl>=11?3:lvl>=5?2:1;if(['paladin','ranger','barbarian'].includes(cls))return lvl>=5?2:1;return 1;}
  function sneakDmg(lvl){return rollN(Math.ceil(lvl/2),6);}

  function buildPC(pcCfg,lvl){
    const def=DATA.CLASSES.find(c=>c.cls===pcCfg.cls)||DATA.CLASSES[0];
    const hp=pcCfg.hpOverride||hpForClass(pcCfg.cls,lvl);
    const ac=pcCfg.acOverride||acForLevel(def.ac,lvl);
    const sl=DATA.slotLvl(pcCfg.cls,lvl);
    const allSpells=DATA.SPELLS[pcCfg.cls]||null;
    const spells=allSpells?allSpells.filter(s=>s.minLvl<=lvl):null;
    return{
      name:def.name,cls:pcCfg.cls,zone:pcCfg.zone,
      em:DATA.CLASS_EMOJI[pcCfg.cls]||'',
      hp,maxHp:hp,chp:hp,ac,
      atk:atkForLevel(def.atkMod,lvl),
      dmgDie:def.dmgDie,dmgBonus:def.dmgBonus,
      atts:extraAtks(pcCfg.cls,lvl),
      slots:spells&&spells.length?DATA.spellSlots(pcCfg.cls,lvl):0,
      spells,sl,lvl,
      cantrip:DATA.CANTRIPS[pcCfg.cls]||null,
      isHealer:['cleric','druid'].includes(pcCfg.cls),
      healUsed:false,surgeUsed:false,
      down:false,dead:false,deathSucc:0,deathFail:0,
    };
  }

  function snapshot(monsters,party){
    return{
      monsters:monsters.map(m=>({name:m.name,em:m.em,chp:m.chp,hp:m.hp,dead:m.dead,boss:m.boss,meleePCs:[...m.meleePCs],targetName:m.target?m.target.name:null,targetZone:m.target?m.target.zone:null})),
      party:party.map(p=>({name:p.name,em:p.em,chp:p.chp,maxHp:p.maxHp,dead:p.dead,down:p.down,zone:p.zone})),
    };
  }

  function pcAct(pc,livingM,party,emit){
    if(pc.dead||pc.down)return;
    if(!livingM().length)return;

    if(pc.isHealer&&!pc.healUsed){
      const downed=party.filter(p=>p.down&&!p.dead);
      const wounded=party.filter(p=>!p.dead&&!p.down&&p.chp<p.maxHp*0.4);
      const ht=downed[0]||wounded.sort((a,b)=>a.chp-b.chp)[0];
      if(ht){
        const amt=roll(8)+3;
        ht.chp=Math.min(ht.maxHp,ht.chp+amt);
        if(ht.down){ht.down=false;ht.deathSucc=0;ht.deathFail=0;}
        pc.healUsed=true;
        emit({type:'heal',healer:pc.name,target:ht.name,amt});
        return;
      }
    }

    const primaryTgt=()=>livingM().sort((a,b)=>b.chp-a.chp)[0];
    let tgt=livingM().find(m=>m.target===pc)||primaryTgt();
    if(!tgt||tgt.dead)tgt=primaryTgt();
    if(!tgt)return;

    let atts=pc.atts;
    if(pc.cls==='fighter'&&!pc.surgeUsed&&livingM().some(m=>m.chp<m.hp*0.5)){
      atts*=2;pc.surgeUsed=true;emit({type:'surge',caster:pc.name});
    }

    if(pc.spells&&pc.spells.length&&pc.slots>0){
      const spell=pc.spells[Math.floor(Math.random()*pc.spells.length)];
      pc.slots--;
      let dmg=spell.dmg(pc.sl,pc.lvl);
      const saved=spell.save&&(roll(20)+2>=spell.save);
      if(saved)dmg=Math.floor(dmg/2);
      tgt.chp-=dmg;
      if(tgt.chp<=0)tgt.dead=true;
      emit({type:'spell',caster:pc.name,spell:spell.name,target:tgt.name,hit:true,saved,dmg});
      if(spell.aoe&&spell.zone==='melee'){
        for(const t of party.filter(p=>!p.dead&&!p.down&&p.zone==='melee'&&p!==pc)){
          const ffd=Math.floor(spell.dmg(pc.sl,pc.lvl)/2);
          t.chp-=ffd;
          emit({type:'friendly_fire',target:t.name,dmg:ffd});
        }
      }
      tgt.target=pc;return;
    }

    if(pc.cantrip&&pc.spells){
      const c=pc.cantrip,dmg=c.dmg(pc.lvl);
      if(c.type==='attack'){
        const ar=roll(20)+pc.atk,crit=ar-pc.atk===20;
        if(ar>=tgt.ac||crit){
          const total=crit?dmg+c.dmg(pc.lvl):dmg;
          tgt.chp-=total;if(tgt.chp<=0)tgt.dead=true;
          emit({type:'cantrip',caster:pc.name,spell:c.name,target:tgt.name,hit:true,crit,dmg:total});
          tgt.target=pc;
        }else{emit({type:'cantrip',caster:pc.name,spell:c.name,target:tgt.name,hit:false,crit:false,dmg:0});}
      }else{
        const sv=roll(20)+2;
        if(sv<c.dc){
          tgt.chp-=dmg;if(tgt.chp<=0)tgt.dead=true;
          emit({type:'cantrip',caster:pc.name,spell:c.name,target:tgt.name,hit:true,crit:false,dmg});
          tgt.target=pc;
        }else{emit({type:'cantrip',caster:pc.name,spell:c.name,target:tgt.name,hit:false,crit:false,dmg:0});}
      }
      return;
    }

    for(let a=0;a<atts;a++){
      if(!livingM().length)break;
      if(tgt.dead){tgt=primaryTgt();if(!tgt)break;}
      let extra=0;
      if(pc.cls==='rogue'&&Math.random()<0.35){extra=sneakDmg(pc.lvl);emit({type:'sneak',rogue:pc.name,bonus:extra});}
      const ar=roll(20)+pc.atk,crit=ar-pc.atk===20;
      if(ar>=tgt.ac||crit){
        let dmg=rollN(1,pc.dmgDie)+pc.dmgBonus;
        if(crit)dmg+=rollN(1,pc.dmgDie);
        tgt.chp-=dmg+extra;if(tgt.chp<=0)tgt.dead=true;
        emit({type:'attack',attacker:pc.name,target:tgt.name,hit:true,crit,dmg:dmg+extra,roll:ar});
        tgt.target=pc;
      }else{emit({type:'attack',attacker:pc.name,target:tgt.name,hit:false,crit:false,dmg:0,roll:ar});}
    }
  }

  function simulate(mCfgs,party){
    const monsters=mCfgs.map(m=>({
      ...m,chp:m.hp,
      dmgFn:parseDmg(m.dmgStr),
      saDmgFn:m.saName?parseDmg(m.saDmg):null,
      em:m.boss?DATA.MONSTER_EMOJI.boss:DATA.MONSTER_EMOJI.minion,
      dead:false,target:null,meleePCs:[],
    }));

    const meleePCs=party.filter(p=>p.zone==='melee');
    meleePCs.forEach((p,i)=>monsters[i%monsters.length].meleePCs.push(p.name));

    const events=[];let round=0;
    const livingM=()=>monsters.filter(m=>!m.dead&&m.chp>0);
    const livingP=()=>party.filter(p=>!p.dead&&!p.down&&p.chp>0);
    function emit(ev){events.push({...ev,state:snapshot(monsters,party)});}

    while(round<200&&livingM().length>0&&party.some(p=>!p.dead)){
      round++;
      emit({type:'round_start',round});
      const allLiving=livingP();

      for(const m of livingM()){
        let myMelee=allLiving.filter(p=>p.zone==='melee'&&m.meleePCs.includes(p.name));
        if(!myMelee.length)myMelee=allLiving.filter(p=>p.zone==='melee');
        const pool=myMelee.length?myMelee:allLiving.filter(p=>p.zone==='back');
        if(!pool.length)continue;
        if(!m.target||m.target.dead||m.target.down||m.target.chp<=0)
          m.target=pool.slice().sort((a,b)=>b.chp-a.chp)[0];

        if(m.saName&&round%m.saEvery===0){
          const targets=m.saZone==='all'?allLiving:m.saZone==='melee'?allLiving.filter(p=>p.zone==='melee'):allLiving.filter(p=>p.zone==='back');
          const dmgs=targets.map(t=>{
            let d=m.saDmgFn();
            if(m.saDC>0&&roll(20)+2>=m.saDC)d=Math.floor(d/2);
            t.chp-=d;return d;
          });
          emit({type:'special',attacker:m.name,ability:m.saName,targets:targets.map(t=>t.name),dmg:dmgs});
        }

        let attsThisTurn=m.atts;
        if(m.type==='melee'&&round===1)attsThisTurn=Math.max(1,attsThisTurn-1);
        for(let a=0;a<attsThisTurn;a++){
          if(!m.target||m.target.dead||m.target.down||m.target.chp<=0)break;
          const ar=roll(20)+m.atk,crit=ar-m.atk===20;
          if(ar>=m.target.ac||crit){
            let dmg=m.dmgFn();if(crit)dmg+=m.dmgFn();
            m.target.chp-=dmg;
            emit({type:'attack',attacker:m.name,target:m.target.name,hit:true,crit,dmg,roll:ar});
          }else{emit({type:'attack',attacker:m.name,target:m.target.name,hit:false,crit:false,dmg:0,roll:ar});}
        }
      }

      for(const p of party){
        if(p.chp<=0&&!p.down&&!p.dead){p.down=true;p.chp=0;emit({type:'down',name:p.name});}
        if(p.down&&!p.dead){
          const ds=roll(20);
          if(ds===20){p.chp=1;p.down=false;p.deathSucc=0;p.deathFail=0;emit({type:'recovery',name:p.name});}
          else if(ds>=10){p.deathSucc++;if(p.deathSucc>=3){p.down=false;p.chp=1;emit({type:'stabilized',name:p.name});}}
          else{p.deathFail++;if(p.deathFail>=3){p.dead=true;emit({type:'death',name:p.name});}}
        }
      }

      if(!livingM().length)break;
      for(const pc of party){if(!livingM().length)break;pcAct(pc,livingM,party,emit);}
      emit({type:'round_end',round});
    }

    const monstersWon=livingM().length>0;
    emit({type:'combat_end',monstersWon,rounds:round,deaths:party.filter(p=>p.dead).length});
    return{monstersWon,rounds:round,deaths:party.filter(p=>p.dead).length,events};
  }

  return{roll,rollN,simulate,buildPC};
})();

// UI
// ============================================================
const UI = (() => {
  let monsterRows=[],pcRows=[],mIdCtr=0,pcIdCtr=0;
  let watchEvents=[],watchIdx=0,watchTimer=null,watchSpeed=500;

  // ── Event → transcript text ──────────────────────────────
  function eventToText(ev){
    const em=(name,state)=>{
      const m=state.monsters.find(x=>x.name===name);if(m)return m.em;
      const p=state.party.find(x=>x.name===name);return p?p.em:'';
    };
    switch(ev.type){
      case 'round_start':  return `=== Round ${ev.round} ===`;
      case 'round_end':    return '';
      case 'combat_end':   return `--- ${ev.monstersWon?'Monsters win':'Party wins'} after ${ev.rounds} rounds. Deaths: ${ev.deaths} ---`;
      case 'attack':       return ev.hit
        ? `  ${em(ev.attacker,ev.state)} ${ev.attacker} attacks ${em(ev.target,ev.state)} ${ev.target}: ${ev.dmg}dmg${ev.crit?' CRIT':''} (${ev.roll})`
        : `  ${em(ev.attacker,ev.state)} ${ev.attacker} attacks ${em(ev.target,ev.state)} ${ev.target}: MISS (${ev.roll})`;
      case 'spell':        return `  ${em(ev.caster,ev.state)} ${ev.caster} casts ${ev.spell} at ${em(ev.target,ev.state)} ${ev.target}: ${ev.dmg}dmg${ev.saved?' (saved)':''}`;
      case 'cantrip':      return ev.hit
        ? `  ${em(ev.caster,ev.state)} ${ev.caster} casts ${ev.spell} at ${em(ev.target,ev.state)} ${ev.target}: ${ev.dmg}dmg${ev.crit?' CRIT':''}`
        : `  ${em(ev.caster,ev.state)} ${ev.caster} casts ${ev.spell} at ${em(ev.target,ev.state)} ${ev.target}: MISS`;
      case 'heal':         return `  ${em(ev.healer,ev.state)} ${ev.healer} heals ${em(ev.target,ev.state)} ${ev.target} for ${ev.amt}`;
      case 'special':      return `  ${em(ev.attacker,ev.state)} ${ev.attacker} uses ${ev.ability}! → ${ev.targets.map((t,i)=>`${em(t,ev.state)}${t}:${ev.dmg[i]}dmg`).join(', ')}`;
      case 'friendly_fire':return `    Friendly fire ${em(ev.target,ev.state)} ${ev.target}: ${ev.dmg}dmg`;
      case 'surge':        return `  ⚡ ${ev.caster}: ACTION SURGE`;
      case 'sneak':        return `  🗡️ Rogue: SNEAK ATTACK +${ev.bonus}`;
      Not complete — got cut off again at the UI section. Continuing from the `sneak` case:

```javascript
      case 'down':         return `  ${em(ev.name,ev.state)} ${ev.name}: DOWN`;
      case 'death':        return `  ${em(ev.name,ev.state)} ${ev.name}: DEAD`;
      case 'recovery':     return `  ${em(ev.name,ev.state)} ${ev.name}: miraculous recovery`;
      case 'stabilized':   return `  ${em(ev.name,ev.state)} ${ev.name}: stabilized`;
      default:             return '';
    }
  }

  // ── HP bar color ─────────────────────────────────────────
  function hpColor(pct){return pct>0.5?'#639922':pct>0.25?'#BA7517':'#A32D2D';}

  // ── Build combatant widget ────────────────────────────────
  function makeCombatant(em,chp,maxHp,dead,down,isDeathFlash,isHit,isCrit,actionEm){
    if(dead&&!isDeathFlash)return null;
    const wrap=document.createElement('div');wrap.className='combatant';
    const emEl=document.createElement('div');emEl.className='combatant-em';
    if(isDeathFlash){emEl.textContent=em+'💀';}
    else{let label=em;if(isHit)label+=isCrit?'💥💥':'💥';if(actionEm)label+=actionEm;emEl.textContent=label;emEl.style.opacity=down?'0.5':'1';}
    wrap.appendChild(emEl);
    if(!dead&&!down&&!isDeathFlash&&maxHp>0){
      const pct=Math.max(0,Math.min(1,chp/maxHp));
      const bw=document.createElement('div');bw.className='hp-bar-wrap';
      const b=document.createElement('div');b.className='hp-bar';
      b.style.width=Math.round(pct*100)+'%';b.style.background=hpColor(pct);
      bw.appendChild(b);wrap.appendChild(bw);
    }
    return wrap;
  }

  // ── Build battlefield clusters from state ─────────────────
  function buildClusters(state){
    const {monsters,party}=state;
    const livingM=monsters.filter(m=>!m.dead);
    const clusters=[];const assigned=new Set();
    for(const m of livingM){
      if(assigned.has(m.name))continue;
      const myPCNames=m.meleePCs;
      const cms=[m];assigned.add(m.name);
      for(const m2 of livingM){
        if(assigned.has(m2.name))continue;
        if(JSON.stringify(m2.meleePCs.slice().sort())===JSON.stringify(myPCNames.slice().sort())){
          cms.push(m2);assigned.add(m2.name);
        }
      }
      const pcMap=new Map();
      for(const mc of cms){for(const pn of mc.meleePCs){const p=party.find(x=>x.name===pn);if(p)pcMap.set(p.name,p);}}
      // Also include target if in back zone and targeting this cluster
      for(const mc of cms){
        if(mc.targetName&&mc.targetZone==='back'){
          const p=party.find(x=>x.name===mc.targetName);
          if(p&&!p.dead)pcMap.set(p.name,p);
        }
      }
      clusters.push({monsters:cms,pcs:[...pcMap.values()]});
    }
    const engagedNames=new Set(clusters.flatMap(c=>c.pcs.map(p=>p.name)));
    const backPCs=party.filter(p=>p.zone==='back'&&!engagedNames.has(p.name));
    return{clusters,backPCs};
  }

  // ── Render battlefield ────────────────────────────────────
  function renderBattlefield(el,ev){
    el.innerHTML='';
    const state=ev.state;
    const rl=document.createElement('div');rl.className='round-label';
    rl.textContent=ev.type==='round_start'?`Round ${ev.round}`:(ev.round?`Round ${ev.round}`:'');
    el.appendChild(rl);

    const {clusters,backPCs}=buildClusters(state);
    const inner=document.createElement('div');inner.className='bf-inner';

    // Determine hit/death targets from this event
    const hitTarget   = (ev.type==='attack'||ev.type==='spell'||ev.type==='cantrip')&&ev.hit ? ev.target : null;
    const critTarget  = hitTarget&&ev.crit ? ev.target : null;
    const deathTarget = ev.type==='death' ? ev.name : null;
    const attacker    = ev.attacker||ev.caster||null;
    const actionEm    = getActionEmoji(ev);

    // Melee section
    const meleeSection=document.createElement('div');meleeSection.className='bf-section';
    const ml=document.createElement('div');ml.className='bf-label';ml.textContent='Melee';
    meleeSection.appendChild(ml);
    const clustersDiv=document.createElement('div');clustersDiv.className='bf-clusters';
    for(const cluster of clusters){
      const cd=document.createElement('div');cd.className='bf-cluster';
      const mrow=document.createElement('div');mrow.className='bf-row';
      for(const m of cluster.monsters){
        const isDeath=deathTarget===m.name;
        const cw=makeCombatant(m.em,m.chp,m.hp,m.dead,false,isDeath,hitTarget===m.name&&!isDeath,critTarget===m.name,attacker===m.name?actionEm:null);
        if(cw)mrow.appendChild(cw);
      }
      cd.appendChild(mrow);
      if(cluster.pcs.length){
        const prow=document.createElement('div');prow.className='bf-row';
        for(const p of cluster.pcs){
          const isDeath=deathTarget===p.name;
          const cw=makeCombatant(p.em,p.chp,p.maxHp,p.dead,p.down,isDeath,hitTarget===p.name&&!isDeath,critTarget===p.name,attacker===p.name?actionEm:null);
          if(cw)prow.appendChild(cw);
        }
        cd.appendChild(prow);
      }
      clustersDiv.appendChild(cd);
    }
    meleeSection.appendChild(clustersDiv);
    inner.appendChild(meleeSection);

    const dv=document.createElement('div');dv.className='bf-divider';inner.appendChild(dv);

    // Back section
    const backSection=document.createElement('div');backSection.className='bf-section';
    const bl=document.createElement('div');bl.className='bf-label';bl.textContent='Back';
    backSection.appendChild(bl);
    const brow=document.createElement('div');brow.className='bf-row';
    for(const p of backPCs){
      const isDeath=deathTarget===p.name;
      const cw=makeCombatant(p.em,p.chp,p.maxHp,p.dead,p.down,isDeath,hitTarget===p.name&&!isDeath,critTarget===p.name,attacker===p.name?actionEm:null);
      if(cw)brow.appendChild(cw);
    }
    backSection.appendChild(brow);
    inner.appendChild(backSection);
    el.appendChild(inner);
  }

  function getActionEmoji(ev){
    if(!ev)return null;
    if(ev.type==='attack'){
      // Determine if attacker is monster or PC
      return '⚔️';
    }
    if(ev.type==='spell'||ev.type==='cantrip')return '✨';
    if(ev.type==='heal')return '💚';
    if(ev.type==='special')return '💥';
    return null;
  }

  // ── Monster builder ───────────────────────────────────────
  function addMonster(isBoss=false,data={}){
    const id=mIdCtr++;
    monsterRows.push({id,boss:isBoss||monsterRows.length===0,...data});
    renderMonsterBuilder();
  }

  function removeMonster(id){
    if(monsterRows.find(m=>m.id===id)?.boss){alert('Cannot remove boss.');return;}
    monsterRows=monsterRows.filter(m=>m.id!==id);

  function renderMonsterBuilder(){
    const el=document.getElementById('monster-builder');
    el.innerHTML=monsterRows.map(m=>{
      const em=m.boss?DATA.MONSTER_EMOJI.boss:DATA.MONSTER_EMOJI.minion;
      return `<div class="monster-card">
        <div class="card-header">
          <span>${em} ${m.boss?'Boss':'Minion'}<span class="boss-label">${m.boss?'boss':'minion'}</span></span>
          ${!m.boss?`<button onclick="UI.removeMonster(${m.id})" style="padding:3px 8px;font-size:11px;margin:0;">Remove</button>`:''}
        </div>
        <div class="row">
          <div class="field"><label>Name</label><input id="mn-${m.id}" value="${m.name||(m.boss?'Boss':'Minion')}"/></div>
          <div class="field"><label>AC</label><input id="mac-${m.id}" type="number" value="${m.ac||13}"/></div>
          <div class="field"><label>HP</label><input id="mhp-${m.id}" type="number" value="${m.hp||(m.boss?50:10)}"/></div>
          <div class="field"><label>Atk bonus</label><input id="matk-${m.id}" type="number" value="${m.atk||4}"/></div>
          <div class="field"><label>Damage</label><input id="mdmg-${m.id}" value="${m.dmg||(m.boss?'1d8+2':'1d6+2')}"/></div>
          <div class="field"><label>Attacks</label><input id="matts-${m.id}" type="number" value="${m.atts||1}"/></div>
          <div class="field"><label>Type</label><select id="mtype-${m.id}">

            <option value="ranged"${m.type==='ranged'?' selected':''}>Ranged</option>
          </select></div>
        </div>
        ${m.boss?`<div style="margin-top:6px;font-size:10px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Special ability — optional</div>
        <div class="row3">
          <div class="field"><label>Name (blank = none)</label><input id="saname-${m.id}" value="${m.saname||''}"/></div>
          <div class="field"><label>Damage</label><input id="sadmg-${m.id}" value="${m.sadmg||'2d6+2'}"/></div>
          <div class="field"><label>Save DC (0=auto)</label><input id="sadc-${m.id}" type="number" value="${m.sadc||0}"/></div>
          <div class="field"><label>Targets</label><select id="sazone-${m.id}">

            <option value="back"${(!m.sazone||m.sazone==='back')?' selected':''}>Back zone</option>
            <option value="all"${m.sazone==='all'?' selected':''}>All</option>
          </select></div>
          <div class="field"><label>Every N rounds</label><input id="saevery-${m.id}" type="number" value="${m.saevery||3}"/></div>
        </div>`:''}
      </div>`;
    }).join('');
  }

  // ── Party builder ─────────────────────────────────────────
  function addPC(cls='Fighter'){
    const id=pcIdCtr++;
    const def=DATA.CLASSES.find(c=>c.name===cls)||DATA.CLASSES[0];
    pcRows.push({id,cls:def.cls,zone:def.zone});
    renderPartyBuilder();
  }

  function removePC(id){pcRows=pcRows.filter(p=>p.id!==id);renderPartyBuilder();}

  function updatePC(id,key,val){
    const p=pcRows.find(p=>p.id===id);
    if(p){p[key]=val;if(key==='cls'){const def=DATA.CLASSES.find(c=>c.cls===val);if(def)p.zone=def.zone;renderPartyBuilder();}}
  }

  function renderPartyBuilder(){
    const el=document.getElementById('party-builder');
    if(!pcRows.length){el.innerHTML='<div style="color:var(--color-text-secondary);font-size:12px;margin-bottom:8px;">No PCs.</div>';return;}

      <div class="pc-row">
        <div class="field"><label>Class</label>
          <select onchange="UI.updatePC(${p.id},'cls',this.value)">
            ${DATA.CLASSES.map(c=>`<option value="${c.cls}"${c.cls===p.cls?' selected':''}>${DATA.CLASS_EMOJI[c.cls]} ${c.name}</option>`).join('')}

          <select onchange="UI.updatePC(${p.id},'zone',this.value)">

        <div class="field"><label>Override HP</label><input type="number" placeholder="auto" onchange="UI.updatePC(${p.id},'hpOverride',this.value?+this.value:null)"/></div>
        <button class="remove-btn" onclick="UI.removePC(${p.id})">×</button>
      </div>`).join('');

  // ── Read form values ──────────────────────────────────────
  function readMonsters(){
    return monsterRows.map(m=>({
      id:m.id,boss:m.boss,
      name:document.getElementById(`mn-${m.id}`)?.value||'Monster',
      ac:+document.getElementById(`mac-${m.id}`)?.value||13,

      saZone:m.boss?(document.getElementById(`sazone-${m.id}`)?.value||'back'):'',

    }));
  }

  function buildParty(lvl){
    return pcRows.map(p=>ENGINE.buildPC(p,lvl));
  }

  // ── Run simulations ───────────────────────────────────────
  function runSims(){
    const mCfgs=readMonsters();
    const lvl=+document.getElementById('plevel').value;
    const N=+document.getElementById('nsims').value||100;
    if(!pcRows.length){document.getElementById('output').innerHTML='<div style="color:var(--color-text-secondary);">Add at least one PC.</div>';return;}
    let wins=0,totalRounds=0,totalDeaths=0;
    for(let i=0;i<N;i++){
      const party=buildParty(lvl);
      const r=ENGINE.simulate(mCfgs,party);
      if(!r.monstersWon)wins++;
      totalRounds+=r.rounds;totalDeaths+=r.deaths;
    }
    const pwPct=((wins/N)*100).toFixed(1);
    const ar=(totalRounds/N).toFixed(1);
    const ad=(totalDeaths/N).toFixed(1);
    const partyDesc=pcRows.map(p=>{const def=DATA.CLASSES.find(c=>c.cls===p.cls);return `${DATA.CLASS_EMOJI[p.cls]||''} ${def.name}<span class="zone-tag">${p.zone}</span>`;}).join(' ');
    const encounterDesc=readMonsters().map(m=>`${m.boss?DATA.MONSTER_EMOJI.boss:DATA.MONSTER_EMOJI.minion} ${m.name}`).join(' + ');
    document.getElementById('output').innerHTML=`
      <div class="result-card">
        <div class="header-meta">${encounterDesc} vs level ${lvl} party — ${N} simulations</div>
        <div class="party-tags">${partyDesc}</div>
        <div class="stat-row">
          <div class="stat"><span class="stat-val ${wins/N>=0.5?'win':'lose'}">${pwPct}%</span><span class="stat-lbl">Party win rate</span></div>
          <div class="stat"><span class="stat-val">${wins}W / ${N-wins}L</span><span class="stat-lbl">Record</span></div>
          <div class="stat"><span class="stat-val">${ar}</span><span class="stat-lbl">Avg rounds</span></div>
          <div class="stat"><span class="stat-val">${ad}</span><span class="stat-lbl">Avg deaths</span></div>
        </div>
      </div>`;
  }

  // ── Watch fight ───────────────────────────────────────────
  function watchFight(){
    const mCfgs=readMonsters();
    const lvl=+document.getElementById('plevel').value;
    if(!pcRows.length){alert('Add at least one PC.');return;}
    const party=buildParty(lvl);
    const result=ENGINE.simulate(mCfgs,party);
    watchEvents=result.events.filter(ev=>ev.type!=='round_end'&&eventToText(ev)!=='');
    watchIdx=0;
    const out=document.getElementById('output');
    const transcript=result.events.map(ev=>eventToText(ev)).filter(t=>t!=='').join('\n');
    out.innerHTML=`
      <div id="battlefield" class="battlefield"></div>
      <div class="ticker-box"><div class="ticker-line" id="ticker-text">...</div></div>
      <div class="ticker-controls">
        <button onclick="UI.toggleWatch()" id="btn-play">Pause</button>
        <button onclick="UI.stepWatch(-1)">← Step</button>
        <button onclick="UI.stepWatch(1)">Step →</button>
        <div class="speed-row"><span>Speed:</span>
          <select onchange="UI.setSpeed(this.value)" style="width:auto;padding:3px 6px;">
            <option value="900">Slow</option>
            <option value="500" selected>Normal</option>
            <option value="250">Fast</option>
            <option value="80">Very fast</option>
          </select>
        </div>
        <span class="progress" id="watch-progress">1 / ${watchEvents.length}</span>
      </div>
      <details style="margin-top:4px;">
        <summary style="cursor:pointer;font-size:11px;color:var(--color-text-secondary);padding:4px 0;">Show full transcript</summary>
        <div class="transcript-box"><pre>${transcript}</pre></div>
      </details>`;
    if(watchEvents.length)renderBattlefield(document.getElementById('battlefield'),watchEvents[0]);
    watchTimer=setInterval(()=>{
      showWatchStep();
      if(watchIdx>=watchEvents.length){clearInterval(watchTimer);watchTimer=null;const b=document.getElementById('btn-play');if(b)b.textContent='Play';}
    },watchSpeed);
  }

  function showWatchStep(){
    const el=document.getElementById('ticker-text');
    const prog=document.getElementById('watch-progress');
    if(!el||watchIdx>=watchEvents.length)return;
    const ev=watchEvents[watchIdx];
    const bf=document.getElementById('battlefield');
    if(bf)renderBattlefield(bf,ev);
    const line=eventToText(ev);
    el.classList.add('fade');
    setTimeout(()=>{
      if(document.getElementById('ticker-text')===el){
        el.textContent=line||'·';el.classList.remove('fade');
        if(prog)prog.textContent=`${watchIdx+1} / ${watchEvents.length}`;
      }
    },150);
    watchIdx++;
  }

  function toggleWatch(){
    const btn=document.getElementById('btn-play');
    if(watchTimer){clearInterval(watchTimer);watchTimer=null;if(btn)btn.textContent='Play';}
    else{
      if(watchIdx>=watchEvents.length)watchIdx=0;
      if(btn)btn.textContent='Pause';
      watchTimer=setInterval(()=>{
        showWatchStep();
        if(watchIdx>=watchEvents.length){clearInterval(watchTimer);watchTimer=null;const b=document.getElementById('btn-play');if(b)b.textContent='Play';}
      },watchSpeed);
    }
  }

  function stepWatch(dir){
    if(watchTimer){clearInterval(watchTimer);watchTimer=null;const b=document.getElementById('btn-play');if(b)b.textContent='Play';}
    if(dir<0)watchIdx=Math.max(0,watchIdx-2);
    showWatchStep();
  }

  function setSpeed(v){
    watchSpeed=+v;
    if(watchTimer){
      clearInterval(watchTimer);
      watchTimer=setInterval(()=>{
        showWatchStep();
        if(watchIdx>=watchEvents.length){clearInterval(watchTimer);watchTimer=null;const b=document.getElementById('btn-play');if(b)b.textContent='Play';}
      },watchSpeed);
    }
  }

  // ── Save / Load ───────────────────────────────────────────
  function saveEncounter(){
    const mCfgs=readMonsters();
    try{localStorage.setItem('playtester_encounter',JSON.stringify({monsters:mCfgs}));alert('Saved.');}
    catch(e){alert('Storage unavailable.');}
  }

  function loadEncounter(){
    try{
      const raw=localStorage.getItem('playtester_encounter');
      if(!raw){alert('No saved encounter.');return;}
      const data=JSON.parse(raw);
      monsterRows=[];mIdCtr=0;
      data.monsters.forEach(m=>addMonster(m.boss,{name:m.name,ac:m.ac,hp:m.hp,atk:m.atk,dmg:m.dmgStr,atts:m.atts,type:m.type,saname:m.saName,sadmg:m.saDmg,sadc:m.saDC,sazone:m.saZone,saevery:m.saEvery}));
      alert('Loaded.');
    }catch(e){alert('Failed to load.');}
  }

  // ── Public API ────────────────────────────────────────────
  return{
    addMonster,removeMonster,
    addPC,removePC,updatePC,
    runSims,watchFight,
    toggleWatch,stepWatch,setSpeed,
    saveEncounter,loadEncounter,
  };
})();

</script>
